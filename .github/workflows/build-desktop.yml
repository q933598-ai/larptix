name: Build Desktop

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate app icons
        run: npm run tauri icon src-tauri/icon-source.png

      - name: Build AppImage
        run: npm run build:linux

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: larptrix-linux-appimage
          path: desktop/dist/*.AppImage
          if-no-files-found: error

  build-windows:
    name: Windows x64 ZIP
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate app icons
        run: npm run tauri icon src-tauri/icon-source.png

      - name: Build Windows ZIP
        run: npm run build:windows

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: larptrix-windows-x64
          path: desktop/dist/*.zip
          if-no-files-found: error
