name: Build Desktop

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux AppImage + pacman
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install pacman build dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-tools

      - name: Generate app icons
        run: npm run tauri icon src-tauri/icon-source.png

      - name: Build AppImage + pacman
        run: npm run build:linux

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: larptrix-linux-appimage
          path: desktop/dist/*.AppImage
          if-no-files-found: error

      - name: Upload pacman package
        uses: actions/upload-artifact@v4
        with:
          name: larptrix-linux-pacman
          path: |
            desktop/dist/*.pacman
            desktop/dist/*.pkg.tar.zst
          if-no-files-found: error

  build-windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate app icons
        run: npm run tauri icon src-tauri/icon-source.png

      - name: Build NSIS installer
        run: npm run build:windows

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: larptrix-windows-installer
          path: desktop/dist/*.exe
          if-no-files-found: error
