name: Build Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "desktop/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android project
        run: npx tauri android init --ci

      - name: Build APK
        run: npx tauri android build --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: larptrix-android-apk
          path: desktop/src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14
