name: Matrix Crypto Validation

on:
  push:
    branches: ["ci/matrix-crypto-final"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo test --workspace

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          node --check client/app.js
          node --check client/matrix-crypto.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --progress=plain -t larptrix-matrix-ci .
