name: Format export

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Package formatted Rust sources
        run: |
          mkdir -p /tmp/formatted
          cp crates/protocol/src/lib.rs /tmp/formatted/protocol-lib.rs
          cp crates/server/src/api.rs /tmp/formatted/server-api.rs
          cp crates/server/src/db.rs /tmp/formatted/server-db.rs
          cp crates/server/src/ws.rs /tmp/formatted/server-ws.rs
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-rust-sources
          path: /tmp/formatted
          retention-days: 1
