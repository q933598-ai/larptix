[workspace]
resolver = "2"
members = ["crates/protocol", "crates/server", "crates/crypto-wasm"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/example/larptrix"

[workspace.dependencies]
larptrix-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
