services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LARPTRIX_COOKIE_SECURE: "1"
      LARPTRIX_ICE_SERVERS: ${LARPTRIX_ICE_SERVERS:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
    volumes:
      - larptrix-data:/app/data
    expose:
      - "8080"
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your DNS hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - internal

volumes:
  larptrix-data:
  caddy-data:
  caddy-config:

networks:
  internal: