<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Larptix</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, #20242d 0, #111318 55%);
      color: #d8dee9;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .card {
      width: min(520px, calc(100vw - 40px));
      padding: 38px;
      border: 1px solid #303641;
      border-radius: 22px;
      background: rgba(24, 27, 34, .96);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, .45),
        inset 0 1px rgba(255, 255, 255, .025);
    }

    .logo {
      margin-bottom: 6px;
      font-size: 34px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 0 0 30px;
      color: #8f98a8;
      font-size: 15px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #aab2c0;
      font-size: 13px;
      font-weight: 600;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 13px 14px;
      border: 1px solid #363d49;
      border-radius: 11px;
      outline: none;
      background: #101217;
      color: #f0f2f5;
      font: inherit;
      font-size: 14px;
    }

    input:focus {
      border-color: #81a1c1;
      box-shadow: 0 0 0 3px rgba(129, 161, 193, .12);
    }

    button {
      padding: 13px 20px;
      border: 0;
      border-radius: 11px;
      background: #81a1c1;
      color: #101217;
      font: inherit;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:active {
      transform: translateY(1px);
    }

    .error {
      min-height: 20px;
      margin-top: 12px;
      color: #e88d8d;
      font-size: 13px;
    }

    .hint {
      margin-top: 24px;
      color: #697282;
      font-size: 12px;
      line-height: 1.55;
    }

    .saved {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #2a2f38;
      color: #747d8d;
      font-size: 12px;
    }

    .saved button {
      margin-top: 8px;
      padding: 0;
      background: transparent;
      color: #81a1c1;
      font-size: 12px;
      font-weight: 600;
    }

    @media (max-width: 560px) {
      .row {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">Larptix</div>
    <p class="subtitle">Connect to a Larptix server</p>

    <label for="server">Server address</label>

    <div class="row">
      <input
        id="server"
        type="url"
        autocomplete="url"
        spellcheck="false"
        placeholder="https://larptrix.duckdns.org"
      >
      <button id="connect" type="button">Connect</button>
    </div>

    <div id="error" class="error"></div>

    <div id="saved" class="saved" hidden>
      Saved server:
      <span id="saved-address"></span>
      <br>
      <button id="forget" type="button">Forget saved server</button>
    </div>

    <div class="hint">
      You can connect to any Larptix server you trust.
      The selected server is stored locally on this device.
    </div>
  </main>

  <script>
    const DEFAULT_SERVER = "https://larptrix.duckdns.org";
    const STORAGE_KEY = "larptrix.server";

    const input = document.getElementById("server");
    const connectButton = document.getElementById("connect");
    const error = document.getElementById("error");
    const saved = document.getElementById("saved");
    const savedAddress = document.getElementById("saved-address");
    const forgetButton = document.getElementById("forget");

    function normalizeServer(value) {
      value = value.trim();

      if (!value) {
        throw new Error("Enter a server address.");
      }

      if (!/^https?:\/\//i.test(value)) {
        value = "https://" + value;
      }

      const url = new URL(value);

      if (!["http:", "https:"].includes(url.protocol)) {
        throw new Error("Only HTTP and HTTPS servers are supported.");
      }

      if (!url.hostname) {
        throw new Error("The server address must contain a hostname.");
      }

      if (url.username || url.password) {
        throw new Error("Credentials in server URLs are not allowed.");
      }

      url.hash = "";
      url.search = "";

      return url.toString().replace(/\/$/, "");
    }

    function showError(message) {
      error.textContent = message;
    }

    function refreshSaved() {
      const value = localStorage.getItem(STORAGE_KEY);

      if (!value) {
        saved.hidden = true;
        return;
      }

      savedAddress.textContent = value;
      saved.hidden = false;
    }

    function connect() {
      showError("");

      try {
        const server = normalizeServer(input.value);

        localStorage.setItem(STORAGE_KEY, server);

        window.location.href = server + "/";
      } catch (err) {
        showError(err?.message || "Invalid server address.");
      }
    }

    connectButton.addEventListener("click", connect);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        connect();
      }
    });

    forgetButton.addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      input.value = DEFAULT_SERVER;
      refreshSaved();
      showError("");
    });

    const savedServer = localStorage.getItem(STORAGE_KEY);

    if (savedServer) {
      input.value = savedServer;

      /*
       * Automatically reconnect on subsequent launches.
       * A short delay leaves the picker available if the page is being
       * opened manually during development.
       */
      setTimeout(() => {
        try {
          const server = normalizeServer(savedServer);
          window.location.href = server + "/";
        } catch {
          localStorage.removeItem(STORAGE_KEY);
          input.value = DEFAULT_SERVER;
          refreshSaved();
        }
      }, 80);
    } else {
      input.value = DEFAULT_SERVER;
    }

    refreshSaved();
  </script>
</body>
</html>
