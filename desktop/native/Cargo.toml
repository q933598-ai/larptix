[package]
name = "larptrix-native"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native Larptrix desktop client built with GPUI"

[workspace]

[dependencies]
async-channel = "2.5"
futures-util = "0.3"
flate2 = "1"
http = "1"
aes-gcm = "0.10"
gstreamer = "=0.25.4"
gstreamer-app = "=0.25.2"
gstreamer-video = "=0.25.4"
image = "0.25"
base64 = "0.22"
getrandom = "0.2"
matrix-sdk-crypto = { version = "=0.19.0", features = ["automatic-room-key-forwarding"] }
matrix-sdk-sqlite = { version = "=0.19.0", default-features = false, features = ["crypto-store", "bundled"] }
ruma = { version = "=0.17.0", features = ["client-api-c"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "a0e666ae930a85ab38947e2d49222b0ea99f1c2f", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a0e666ae930a85ab38947e2d49222b0ea99f1c2f", default-features = false, features = ["font-kit", "wayland", "x11"] }
larptrix-client-core = { path = "../../crates/client-core" }
reqwest = { version = "0.12", features = ["cookies", "json", "multipart", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "fs"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2"
mime_guess = "2"
tempfile = "3"
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "tokio"] }
larptrix-protocol = { path = "../../crates/protocol" }
serde = { version = "1", features = ["derive"] }
