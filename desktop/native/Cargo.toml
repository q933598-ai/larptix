[package]
name = "larptrix-native"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native Larptrix desktop client built with GPUI"

[workspace]

[dependencies]
async-channel = "2.5"
futures-util = "0.3"
gpui = { version = "=0.2.2" }
larptrix-client-core = { path = "../../crates/client-core" }
reqwest = { version = "0.12", features = ["cookies", "json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2"
larptrix-protocol = { path = "../../crates/protocol" }
serde = { version = "1", features = ["derive"] }
